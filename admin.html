<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DriveLux | Booking Data
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    body {
      padding-bottom: 60px;
    }

    .admin {

      max-width: 1250px;

      margin: auto;

      padding: 45px 20px;

    }

    .admin-head {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 25px;

    }

    .table-wrap {

      overflow-x: auto;

      background: #15181d;

      border:
        1px solid #292e35;

      border-radius: 12px;

    }

    table {

      width: 100%;

      border-collapse:
        collapse;

      min-width: 1100px;

    }

    th,
    td {

      padding: 13px;

      text-align: left;

      border-bottom:
        1px solid #292e35;

    }

    th {

      color: #ffb000;

      background: #101216;

    }

    td {

      color: #ddd;

    }

    .delete {

      background: #d33;

      color: white;

      border: 0;

      padding: 7px 10px;

      border-radius: 6px;

      cursor: pointer;

    }

    .count {

      color: #aaa;

      margin-bottom: 15px;

    }

  </style>

</head>


<body>


<div class="admin">


  <!-- HEADER -->

  <div class="admin-head">

    <div>

      <p class="tag">
        ADMIN PANEL
      </p>

      <h2>
        Customer Bookings
      </h2>

    </div>


    <a
      class="btn"
      href="/"
    >
      ← Back to Website
    </a>

  </div>


  <!-- COUNT -->

  <p
    id="count"
    class="count"
  >
    Loading...
  </p>


  <!-- TABLE -->

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>
            Name
          </th>

          <th>
            Email
          </th>

          <th>
            Mobile
          </th>

          <th>
            Car
          </th>

          <th>
            Pickup
          </th>

          <th>
            Return
          </th>

          <th>
            Location
          </th>

          <th>
            Message
          </th>

          <th>
            Created
          </th>

          <th>
            Action
          </th>

        </tr>

      </thead>


      <tbody
        id="bookingTable"
      ></tbody>

    </table>

  </div>

</div>


<script>


// ===============================
// LOAD BOOKINGS
// ===============================

async function loadBookings() {

  const table =
    document.getElementById(
      "bookingTable"
    );

  const count =
    document.getElementById(
      "count"
    );


  try {

    const response =
      await fetch(
        "/api/bookings"
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    count.textContent =
      `Total bookings: ${data.bookings.length}`;


    table.innerHTML =
      data.bookings
        .map(booking => `

        <tr>

          <td>
            ${escapeHtml(
              booking.name
            )}
          </td>

          <td>
            ${escapeHtml(
              booking.email
            )}
          </td>

          <td>
            ${escapeHtml(
              booking.mobile
            )}
          </td>

          <td>
            ${escapeHtml(
              booking.car
            )}
          </td>

          <td>
            ${escapeHtml(
              booking.pickupDate
            )}
          </td>

          <td>
            ${escapeHtml(
              booking.returnDate
            )}
          </td>

          <td>
            ${escapeHtml(
              booking.pickupLocation
            )}
          </td>

          <td>
            ${escapeHtml(
              booking.message || "-"
            )}
          </td>

          <td>
            ${new Date(
              booking.createdAt
            ).toLocaleString()}
          </td>

          <td>

            <button
              class="delete"
              onclick="deleteBooking('${booking._id}')"
            >
              Delete
            </button>

          </td>

        </tr>

      `)
      .join("");


  } catch (error) {

    console.error(error);

    count.textContent =
      "Could not load booking data.";

  }

}


// ===============================
// ESCAPE HTML
// ===============================

function escapeHtml(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[character])
    );

}


// ===============================
// DELETE BOOKING
// ===============================

async function deleteBooking(id) {

  const confirmDelete =
    confirm(
      "Delete this booking?"
    );


  if (!confirmDelete) {

    return;

  }


  try {

    const response =
      await fetch(
        "/api/bookings/" + id,
        {
          method: "DELETE"
        }
      );


    const data =
      await response.json();


    if (data.success) {

      loadBookings();

    } else {

      alert(data.message);

    }


  } catch (error) {

    console.error(error);

    alert(
      "Delete failed"
    );

  }

}


// Load data
loadBookings();

</script>


</body>

</html>
